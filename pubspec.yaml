name: wisata_daerahku
description: Aplikasi Wisata Daerahku - Tugas Media Digital Interaktif
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  image_picker: ^1.2.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  http: ^1.2.2
  google_fonts: ^8.2.1
  flutter_secure_storage: ^11.2.0
  firebase_messaging: ^15.2.10
  google_sign_in: ^7.2.0
  phone_numbers_parser: 9.0.29
  timezone: ^0.11.2
  flutter_map: 8.3.2
  latlong2: 0.9.1
  geolocator: 14.0.2
  url_launcher: 6.3.2
  mobile_scanner: ^7.5.0
  flutter_svg: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/google_g.png
    - assets/images/Candi_Borobudur.jpg
    - assets/images/Pantai_Kuta.jpg